name: Feature request
description: Suggest a capability or improvement for fbx
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `fbx` is deterministic by design, and its scope is governed by
        [`plans/roadmap.md`](https://github.com/humzakhan/fauxbooks/blob/main/plans/roadmap.md). Please check the roadmap
        before filing — your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like fbx to do? Include flags or output shape if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps — sample data, links, related issues.
    validations:
      required: false
