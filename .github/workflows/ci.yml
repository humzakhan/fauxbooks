name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    name: build / vet / fmt / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux/amd64
          - ubuntu-24.04-arm   # linux/arm64  (GitHub-hosted ARM runner, GA May 2024)
          - macos-14           # darwin/arm64 (M1 runner)
          - windows-latest     # windows/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt (unix)
        if: runner.os != 'Windows'
        run: |
          out=$(gofmt -d .)
          if [ -n "$out" ]; then
            echo "gofmt found formatting issues:"
            echo "$out"
            exit 1
          fi

      - name: gofmt (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = gofmt -d .
          if ($out) {
            Write-Error "gofmt found formatting issues:`n$out"
            exit 1
          }

      - name: go test -race
        run: go test ./... -race

      - name: golden fixture smoke (unix)
        if: runner.os != 'Windows'
        run: |
          go run ./cmd/fbx gen monthly-close --seed 1 --period 2026-01 --volume small --out "$RUNNER_TEMP/mc"
          go run ./cmd/fbx gen recon-stress-test --seed 1 --period 2026-01 --volume small --out "$RUNNER_TEMP/st"
          test -f "$RUNNER_TEMP/st/truth.json"

      - name: golden fixture smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go run ./cmd/fbx gen monthly-close --seed 1 --period 2026-01 --volume small --out "$env:RUNNER_TEMP\mc"
          go run ./cmd/fbx gen recon-stress-test --seed 1 --period 2026-01 --volume small --out "$env:RUNNER_TEMP\st"
          if (-not (Test-Path "$env:RUNNER_TEMP\st\truth.json")) { exit 1 }
