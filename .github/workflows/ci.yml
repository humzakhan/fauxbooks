name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    name: build / vet / fmt / test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -d .)
          if [ -n "$out" ]; then
            echo "gofmt found formatting issues:"
            echo "$out"
            exit 1
          fi

      - name: go test -race
        run: go test ./... -race
